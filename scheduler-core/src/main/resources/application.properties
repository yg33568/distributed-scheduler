# ===== 调度中心(Scheduler)配置 =====
# 可用环境变量覆盖：DB_JDBC_URL / DB_USERNAME / DB_PASSWORD / ZK_CONNECT / SCHEDULER_PORT ...

# MySQL（任务持久化）
db.jdbc-url=jdbc:mysql://localhost:3306/scheduler?useSSL=false&serverTimezone=UTC
db.username=root
db.password=123456

# ZooKeeper（leader 选举 + 服务发现）
zk.connect=localhost:2181
zk.session-timeout-ms=10000

# 调度中心 TCP 端口（接收 worker 注册/心跳/任务结果）
scheduler.port=8080
# Admin HTTP 端口（控制台/健康检查）
scheduler.admin-port=8081
# 对外广告地址：容器场景设成服务名(如 scheduler-a)，worker 从 ZK 拿到后用它连接
scheduler.advertise-host=localhost
