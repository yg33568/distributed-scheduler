# ===== 执行器(Worker)配置 =====
# 可用环境变量覆盖：REDIS_HOST / REDIS_PORT / ZK_CONNECT / WORKER_ID ...

# Redis（多级缓存 L2）
redis.host=localhost
redis.port=6379

# ZooKeeper（服务发现：找到当前 leader 并连接）
zk.connect=localhost:2181
zk.session-timeout-ms=10000

# 调度中心地址（手动模式直接连接；Docker 模式优先走 ZK 发现）
scheduler.host=localhost
scheduler.port=8080

# Worker 对外广告地址：容器场景设成服务名(如 worker-a)，供 master 标识节点
worker.advertise-host=localhost
# Worker ID：优先用环境变量/配置指定，留空则自动生成并持久化（重启不漂移）
worker.id=
